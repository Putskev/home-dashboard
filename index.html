<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Dashboard</title>
<meta name="theme-color" content="#0a0d18">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@13.3.0/dist/gridstack.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-decor" aria-hidden="true">
  <span class="blob blob-a"></span>
  <span class="blob blob-b"></span>
  <span class="blob blob-c"></span>
</div>

<header class="topbar">
  <div class="topbar-left">
    <h1 id="clock">--:--</h1>
    <p id="dateline">&nbsp;</p>
  </div>
  <div class="topbar-right">
    <button id="editModeBtn" class="ghost-btn" title="Bearbeiten">✏️ Bearbeiten</button>
  </div>
</header>

<main>
  <div class="toolbar">
    <button id="addLocationBtn" class="add-location-btn">+ Ort hinzufügen</button>
    <button id="addListBtn" class="add-list-btn">+ Neue Liste</button>
    <span class="edit-hint">Im Bearbeiten-Modus: am Griff ⠿ ziehen zum Verschieben, an der Ecke ziehen zum Skalieren</span>
  </div>

  <div id="dashboardGrid" class="grid-stack"></div>
</main>

<!-- Dialog: Ort hinzufügen -->
<dialog id="locationDialog" class="app-dialog">
  <form method="dialog" class="dialog-form">
    <h2>Ort hinzufügen</h2>
    <input id="locationSearchInput" type="text" placeholder="Stadt suchen, z.B. Berlin" autocomplete="off">
    <div id="locationResults" class="location-results"></div>
    <div class="dialog-actions">
      <button type="button" id="closeLocationDialog" class="ghost-btn">Schließen</button>
    </div>
  </form>
</dialog>

<!-- Dialog: Neue Liste -->
<dialog id="listDialog" class="app-dialog">
  <form method="dialog" class="dialog-form" id="newListForm">
    <h2>Neue Liste</h2>
    <input id="newListName" type="text" placeholder="Name der Liste, z.B. Einkaufsliste" autocomplete="off" required>
    <div class="dialog-actions">
      <button type="button" id="cancelNewList" class="ghost-btn">Abbrechen</button>
      <button type="submit" class="primary-btn">Erstellen</button>
    </div>
  </form>
</dialog>

<!-- Dialog: Wetter-Detail -->
<dialog id="weatherDetailDialog" class="app-dialog weather-detail-dialog">
  <div class="dialog-form">
    <div class="detail-header">
      <div>
        <h2 id="detailLocName">Ort</h2>
        <p id="detailUpdated" class="detail-updated"></p>
      </div>
      <button type="button" id="closeWeatherDetail" class="ghost-btn">Schließen</button>
    </div>

    <div class="detail-current">
      <span id="detailIcon" class="detail-icon"></span>
      <div>
        <div id="detailTemp" class="detail-temp"></div>
        <div id="detailDesc" class="detail-desc"></div>
      </div>
    </div>

    <div class="detail-stats" id="detailStats"></div>

    <h3 class="detail-subheading">Stündlich</h3>
    <div id="hourlyRow" class="hourly-row"></div>

    <h3 class="detail-subheading">Nächste Tage</h3>
    <div id="dailyList" class="daily-list"></div>
  </div>
</dialog>

<template id="listCardTemplate">
  <div class="list-card">
    <div class="list-card-header">
      <span class="drag-handle icon-btn" title="Verschieben">⠿</span>
      <span class="list-icon"></span>
      <input class="list-name-input" type="text" />
      <span class="list-count"></span>
      <button class="icon-btn delete-list-btn" title="Liste löschen">✕</button>
    </div>
    <ul class="item-list"></ul>
    <form class="add-item-form">
      <input class="add-item-input" type="text" placeholder="Eintrag hinzufügen…" autocomplete="off" />
      <button type="submit" class="icon-btn add-item-btn" title="Hinzufügen">➕</button>
    </form>
  </div>
</template>

<template id="listItemTemplate">
  <li class="list-item">
    <label class="item-check-label">
      <input type="checkbox" class="item-checkbox" />
      <span class="item-text"></span>
    </label>
    <button class="icon-btn recurring-toggle" title="Tägliche Aufgabe (setzt sich täglich zurück)">↻</button>
    <button class="icon-btn delete-item-btn" title="Eintrag löschen">✕</button>
  </li>
</template>

<template id="weatherCardTemplate">
  <div class="weather-card" role="button" tabindex="0" title="Für Details antippen">
    <span class="drag-handle icon-btn" title="Verschieben">⠿</span>
    <button class="icon-btn remove-location-btn" title="Ort entfernen">✕</button>
    <p class="weather-loc-name"></p>
    <div class="weather-main">
      <span class="weather-icon"></span>
      <span class="weather-temp"></span>
    </div>
    <p class="weather-desc"></p>
    <p class="weather-minmax"></p>
  </div>
</template>

<template id="hourlyItemTemplate">
  <div class="hourly-item">
    <p class="hourly-time"></p>
    <span class="hourly-icon"></span>
    <p class="hourly-temp"></p>
    <p class="hourly-precip"></p>
  </div>
</template>

<template id="dailyItemTemplate">
  <div class="daily-item">
    <p class="daily-day"></p>
    <span class="daily-icon"></span>
    <p class="daily-desc"></p>
    <p class="daily-precip"></p>
    <p class="daily-minmax"></p>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/gridstack@13.3.0/dist/gridstack-all.js"></script>
<script src="app.js"></script>
</body>
</html>
